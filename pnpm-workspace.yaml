packages:
  - "apps/*"
  - "packages/*"

# One version per dependency, shared by every package via `"name": "catalog:"`.
# Entries are added as packages start using them.
catalog:
  # 6.0, not 7: typescript-eslint supports TypeScript <6.1 (docs/decisions/0002).
  typescript: 6.0.3
  # Matches the Node major we run (.nvmrc), so types never offer APIs Node 24 lacks.
  "@types/node": 24.19.2
  eslint: 10.14.0
  next: 16.4.4
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  tailwindcss: ^4.3.5
  "@tailwindcss/vite": ^4.3.5
  storybook: 10.6.2
  "@storybook/react-vite": 10.6.2
  "@storybook/addon-a11y": 10.6.2
  zod: ^4.6.7

# Refuse to install when Node or pnpm don't satisfy `engines`.
engineStrict: true

# Wait a day before installing a newly published version, so a compromised
# release has time to be caught and pulled.
minimumReleaseAge: 1440

# Dependencies may not run install scripts unless listed here.
allowBuilds:
  esbuild: true
